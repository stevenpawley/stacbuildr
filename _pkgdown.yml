url: https://stevenpawley.github.io/stacbuildr/
template:
  bootstrap: 5

articles:
  - title: "Articles"
    navbar: ~
    contents:
      - stac-catalog
      - stac-extensions
      - pystac

reference:
  - title: "Overview"
    contents:
      - stacbuildr-package

  - title: "Core STAC Objects"
    desc: "Create and manipulate the three fundamental STAC object types."
    contents:
      - stac_catalog
      - stac_collection
      - stac_item

  - title: "Assets"
    desc: "Create and attach data assets to STAC Items and Collections."
    contents:
      - stac_asset
      - add_asset
      - print.stac_asset

  - title: "Links"
    desc: "Build and manage the link graph between STAC objects."
    contents:
      - add_link
      - add_self_link
      - add_root_link
      - add_child
      - add_item
      - get_children
      - get_items
      - get_item_links
      - count_items
      - remove_item

  - title: "Collection Metadata Helpers"
    desc: "Helper constructors for Collection fields."
    contents:
      - stac_extent
      - stac_provider
      - stac_summaries
      - extent_from_items
      - add_item_assets
      - print.stac_provider
      - print.stac_summaries

  - title: "terra Integration"
    desc: >
      Create STAC Items and preview/thumbnails directly from `terra` raster objects,
      and extract band metadata.
    contents:
      - item_from_terra
      - bands_from_terra
      - preview_from_terra

  - title: "sf Integration"
    desc: "Create STAC Items and thumbnails from `sf` vector objects."
    contents:
      - item_from_sf
      - geometry_from_sf
      - thumbnail_from_sf

  - title: "lidR Integration"
    desc: >
      Create STAC Items from LAS/LAZ point clouds and `lidR` catalogues,
      deriving point cloud and projection metadata from the file header.
    contents:
      - item_from_lidr
      - items_from_lascatalog
      - schemas_from_lidr

  - title: "Raster Extension"
    desc: >
      Add the STAC Raster Extension to Items and build per-band metadata
      objects.
    contents:
      - add_raster_extension
      - raster_band
      - raster_statistics
      - raster_histogram
      - raster_from_file
      - print.raster_statistics
      - print.raster_histogram

  - title: "EO Extension"
    desc: >
      Add the STAC Electro-Optical Extension to Items, with pre-built band
      definitions for common sensors.
    contents:
      - add_eo_extension
      - eo_band
      - print.eo_band
      - landsat_oli_bands
      - sentinel2_msi_bands
      - worldview3_bands
      - skysat_bands
      - planetscope_bands

  - title: "Classification Extension"
    desc: >
      Add the STAC Classification Extension to Items
    contents:
      - add_classification_extension
      - classification_class
      - classification_bitfield
      - print.classification_class
      - print.classification_bitfield

  - title: "Scientific Citation Extension"
    desc: >
      Add the STAC Scientific Citation Extension to Items, recording the DOI,
      human-readable citation, and related publications for a dataset.
    contents:
      - add_scientific_extension
      - scientific_publication
      - print.scientific_publication

  - title: "Table Extension"
    desc: >
      Add the STAC Table Extension to Items, describing tabular datasets
      (e.g. GeoParquet) including columns, primary geometry, and row count.
    contents:
      - add_table_extension
      - table_column
      - print.table_column

  - title: "Vector Extension"
    desc: >
      Add the STAC Vector Extension to Items, describing geometry types and
      mapping resolution (minimum mapping unit/width, reference scale) of
      vector data.
    contents:
      - add_vector_extension

  - title: "Projection Extension"
    desc: >
      Add the STAC Projection Extension to Items, recording the native CRS,
      grid shape and affine transform alongside the WGS84 geometry that STAC
      itself requires.
    contents:
      - add_projection_extension

  - title: "Point Cloud Extension"
    desc: >
      Add the STAC Point Cloud Extension to Items, describing point count,
      phenomenology, per-dimension schemas, density, and per-channel
      statistics of point cloud datasets.
    contents:
      - add_pointcloud_extension
      - pc_schema
      - pc_statistic
      - print.pc_schema
      - print.pc_statistic

  - title: "Datacube Extension"
    desc: >
      Add the STAC Datacube Extension to Items, describing N-dimensional
      data cube dimensions (spatial, temporal, geometry, or additional) and
      variables.
    contents:
      - add_datacube_extension
      - cube_dimension
      - cube_variable
      - print.cube_dimension
      - print.cube_variable
    
  - title: "Render Extension"
    desc: >
      Add the STAC Render Extension to Items or Collections, describing
      aspects of rendering behaviour of items or collections in terms
      of colour ramps, nodata values, and band scaling.
    contents:
      - render_object
      - add_render_extension
      - print.render_object

  - title: "Read / Write"
    desc: "Serialise STAC objects to JSON on disk and read them back."
    contents:
      - write_stac
      - write_catalog
      - write_item
      - read_stac

  - title: "Working with Catalogs as Data"
    desc: >
      Coerce Catalogs, Collections and Items into the shapes R works in. A
      catalog answers `length()` with its item count and subsets to its Items;
      `as.data.frame()` gives one row per Item and `st_as_sf()` the same table
      with footprints attached. The `sf` accessors work on an Item directly.
    contents:
      - length.stac_catalog
      - as.data.frame.stac_catalog
      - st_as_sf.stac_catalog
      - stac_item_sf_accessors
      - sub-.stac_catalog

  - title: "Validation"
    desc: >
      Validate STAC objects against the specification. `validate_stac()` applies
      fast, offline structural checks. `validate_stac_schema()` validates against
      the official JSON Schemas hosted at `schemas.stacspec.org` (requires
      network access and the `jsonvalidate` package).
    contents:
      - validate_stac
      - validate_stac_schema
      - print.stac_validation
